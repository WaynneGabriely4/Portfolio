<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfólio | Waynne Gabriely</title>
  <meta name="description" content="Portfólio profissional de Waynne Gabriely.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: Arial, Helvetica, sans-serif; background: #f4f1ed; }
    body { display: flex; flex-direction: column; }
    header {
      min-height: 64px;
      padding: 12px 18px;
      background: #5c463c;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .title { font-size: 18px; font-weight: 700; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    a.button {
      color: #5c463c;
      background: #fff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    main { flex: 1; min-height: 0; }
    iframe { width: 100%; height: 100%; border: 0; background: white; }
    .mobile {
      display: none;
      padding: 32px 20px;
      text-align: center;
      color: #4b403b;
    }
    .mobile a.button {
      display: inline-block;
      background: #5c463c;
      color: #fff;
      margin-top: 12px;
    }
    @media (max-width: 720px) {
      iframe { display: none; }
      .mobile { display: block; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Portfólio — Waynne Gabriely</div>
    <div class="actions">
      <a class="button" href="Portfolio%20Profissional.pdf" target="_blank" rel="noopener">Abrir portfólio</a>
      <a class="button" href="Portfolio%20Profissional.pdf" download>Baixar PDF</a>
    </div>
  </header>

  <main>
    <iframe src="Portfolio%20Profissional.pdf#view=FitH" title="Portfólio profissional de Waynne Gabriely"></iframe>
    <div class="mobile">
      <h2>Portfólio Profissional</h2>
      <p>Toque no botão abaixo para visualizar o portfólio completo.</p>
      <a class="button" href="Portfolio%20Profissional.pdf" target="_blank" rel="noopener">Ver portfólio</a>
    </div>
  </main>
</body>
</html>
